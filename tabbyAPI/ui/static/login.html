<!DOCTYPE html>
<html lang="en" class="ui-loading">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabby Stack — Sign in</title>
  <style>
    html { background: var(--boot-bg, #0b0d12); color-scheme: dark; }
    body { margin: 0; background: var(--boot-bg, #0b0d12); color: #e8ecf4; }
    html.ui-loading body { visibility: hidden; }
    html.ui-loading::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--boot-bg, #0b0d12);
      z-index: 2147483647;
      pointer-events: none;
    }
  </style>
  <noscript>
    <style>
      html.ui-loading body { visibility: visible; }
      html.ui-loading::before { content: none; }
    </style>
  </noscript>
  <script>
    window.TABBY_UI_BASE = (function () {
      var p = location.pathname || "";
      var m = "/v1/ui";
      var i = p.indexOf(m);
      return i >= 0 ? p.slice(0, i + m.length) : m;
    })();
    window.TABBY_REVEAL_UI = function () {
      document.documentElement.classList.remove("ui-loading");
    };
    setTimeout(window.TABBY_REVEAL_UI, 8000);
    (function () {
      var THEME_KEY = "tabby-ui-theme";
      var MODE_KEY = "tabby-ui-mode";
      var FAMILIES = { midnight: 1, ember: 1, glacier: 1, moss: 1, contrast: 1 };
      var MODES = { dark: 1, light: 1, system: 1 };
      var BG = {
        "midnight-dark": "#0b0d12",
        "midnight-light": "#f4f6fb",
        "ember-dark": "#140e0c",
        "ember-light": "#faf4eb",
        "glacier-dark": "#0a1218",
        "glacier-light": "#f2f7fa",
        "moss-dark": "#0e1410",
        "moss-light": "#f3f6f1",
        "contrast-dark": "#000000",
        "contrast-light": "#ffffff"
      };
      function read(key, fallback, allowed) {
        var v = "";
        try { v = localStorage.getItem(key) || ""; } catch (e) {}
        return allowed[v] ? v : fallback;
      }
      function family() { return read(THEME_KEY, "midnight", FAMILIES); }
      function mode() { return read(MODE_KEY, "dark", MODES); }
      function resolved() {
        var m = mode();
        if (m === "system") {
          m = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        }
        return family() + "-" + m;
      }
      function apply(id) {
        id = id || resolved();
        var root = document.documentElement;
        var bg = BG[id] || BG["midnight-dark"];
        var light = /-light$/.test(id);
        root.setAttribute("data-theme", id);
        root.style.colorScheme = light ? "light" : "dark";
        root.style.setProperty("--boot-bg", bg);
        root.style.background = bg;
      }
      apply();
    })();
    window.TABBY_UI_ASSET_V = "20260826-ui-sanity";
    document.write('<link rel="stylesheet" href="' + TABBY_UI_BASE + "/assets/styles.css?v=" + TABBY_UI_ASSET_V + '">');
  </script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <p class="eyebrow">Tabby Stack</p>
        <h1>Management console</h1>
      </div>
    </div>
    <p class="lede">Sign in with the Linux account that runs this stack (admin), or a Tabby account the admin created.</p>
    <form id="login-form" autocomplete="on">
      <label>
        Username
        <input id="username" name="username" type="text" required autofocus />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" required />
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn primary" id="login-btn">Sign in</button>
    </form>
  </main>
  <script>
    document.write('<script src="' + TABBY_UI_BASE + "/assets/auth.js?v=" + TABBY_UI_ASSET_V + '"><\/script>');
  </script>
  <script>
    if (typeof TABBY_REVEAL_UI === "function") TABBY_REVEAL_UI();
  </script>
</body>
</html>
