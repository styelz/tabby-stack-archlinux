<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabby Stack — Sign in</title>
  <script>
    window.TABBY_UI_BASE = (function () {
      var p = location.pathname || "";
      var m = "/v1/ui";
      var i = p.indexOf(m);
      return i >= 0 ? p.slice(0, i + m.length) : m;
    })();
    document.write('<link rel="stylesheet" href="' + TABBY_UI_BASE + '/assets/styles.css?v=20260824-chat-status" />');
  </script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <p class="eyebrow">Tabby Stack</p>
        <h1>Management console</h1>
      </div>
    </div>
    <p class="lede">Sign in with the Linux account that runs this stack.</p>
    <form id="login-form" autocomplete="on">
      <label>
        Username
        <input id="username" name="username" type="text" required autofocus />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" required />
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn primary" id="login-btn">Sign in</button>
    </form>
  </main>
  <script>
    document.write('<script src="' + TABBY_UI_BASE + '/assets/auth.js?v=20260824-chat-status"><\/script>');
  </script>
</body>
</html>
