<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabby Stack — Sign in</title>
  <link rel="stylesheet" href="/ui/assets/styles.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <p class="eyebrow">Tabby Stack</p>
        <h1>Management console</h1>
      </div>
    </div>
    <p class="lede">Sign in with the Linux account that runs this stack.</p>
    <form id="login-form" autocomplete="on">
      <label>
        Username
        <input id="username" name="username" type="text" required autofocus />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" required />
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="btn primary" id="login-btn">Sign in</button>
    </form>
  </main>
  <script src="/ui/assets/auth.js"></script>
</body>
</html>
