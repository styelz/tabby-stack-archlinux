# Sample YAML file for override presets.
# Each block is a sampler fallback. Remove ones you do not need.
# override: value used when the request omits the field
# force: true always overwrites the request value
# additive: true appends this list to the request instead of replacing it
#
# ExLlamaV3 ignores these even if forced (API compatibility only):
# ban_eos_token, allowed_tokens, smoothing_factor, top_a, tfs, typical,
# skew, dry_multiplier, mirostat_mode, temp_exponent

# MARK: Misc generation parameters
# max_tokens / min_tokens: completion length bounds (0 max = model default)
max_tokens:
  override: 150
  force: false
min_tokens:
  override: 0
  force: false
# stop / banned_strings: halt or ban these strings (additive merges lists)
stop:
  override: []
  force: false
  additive: false
banned_strings:
  override: []
  force: false
  additive: false
# token_healing: bias the first token toward the prompt's last piece
token_healing:
  override: false
  force: false
# Commented out because the default is dynamically scaled
#generate_window:
  #override: 512
  #force: false

# MARK: Temperature
# temperature: 0 is greedy. temperature_last applies temp after other samplers.
# min_temp / max_temp / temp_exponent: dynamic temperature (exponent ignored by exl3)
# smoothing_factor: quadratic smoothing (ignored by exl3)
temperature:
  override: 1.0
  force: false
temperature_last:
  override: false
  force: false
min_temp:
  override: 1.0
  force: false
max_temp:
  override: 1.0
  force: false
temp_exponent:
  override: 1.0
  force: false
smoothing_factor:
  override: 0.0
  force: false

# MARK: Alphabet soup
# top_k 0 = disabled. top_p / min_p truncate the nucleus.
# top_a / tfs / typical / skew: accepted then ignored by exl3
# xtc_*: exclude-top-choices sampler (probability 0 disables)
top_k:
  override: 0
  force: false
top_p:
  override: 1.0
  force: false
top_a:
  override: 0.0
  force: false
min_p:
  override: 0.0
  force: false
tfs:
  override: 1.0
  force: false
typical:
  override: 1.0
  force: false
skew:
  override: 0.0
  force: false
xtc_probability:
  override: 0.0
  force: false
xtc_threshold:
  override: 0.1
  force: false

# MARK: Penalty settings
# frequency / presence / repetition: 0 or 1.0 leave the sampler inactive
# repetition_decay: tokens over which the repetition penalty fades
# penalty_range -1 = whole context (exl3 does not auto-scale this)
frequency_penalty:
  override: 0.0
  force: false
presence_penalty:
  override: 0.0
  force: false
repetition_penalty:
  override: 1.0
  force: false
repetition_decay:
  override: 0
  force: false
penalty_range:
  override: -1
  force: false

# MARK: DRY
# Don't Repeat Yourself. dry_multiplier 0 disables (ignored by exl3)
dry_multiplier:
  override: 0.0
  force: false
dry_base:
  override: 0.0
  force: false
dry_allowed_length:
  override: 0
  force: false
dry_range:
  override: 0
  force: false
dry_sequence_breakers:
  override: []
  force: false
  additive: false

# MARK: Mirostat
# mirostat_mode 0 disables (ignored by exl3)
mirostat_mode:
  override: 0
  force: false
mirostat_tau:
  override: 1.5
  force: false
mirostat_eta:
  override: 0.3
  force: false

# MARK: Token options
# add_bos_token: null uses the tokenizer default
# ban_eos_token / allowed_tokens: ignored by exl3
# logit_bias / banned_tokens: applied when non-empty
add_bos_token:
  override:
  force: false
ban_eos_token:
  override: false
  force: false
logit_bias:
  override:
  force: false
  additive: false
banned_tokens:
  override: []
  force: false
  additive: false
allowed_tokens:
  override: []
  force: false
  additive: false

# MARK: Adaptive-P
# adaptive_target 1.0 disables. decay is the EMA rate when enabled.
adaptive_target:
  override: 1.0
  force: false
adaptive_decay:
  override: 0.9
  force: false

# MARK: Loop detection
# Tokens of recent output scanned for repeats. 0 disables.
loop_detect_window:
  override: 800
  force: false