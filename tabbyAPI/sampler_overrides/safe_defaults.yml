# Minimal "safe" fallback settings for most models, used when the frontend doesn't supply any settings
# with a request.

temperature:
  override: 0.8
  force: false

top_p:
  override: 0.9
  force: false

# ExLlamaV3 stops mid-reply if it thinks tokens are repeating.
# Agent tool XML and code trip that often; disable it for local coding.
loop_detect_window:
  override: 0
  force: true